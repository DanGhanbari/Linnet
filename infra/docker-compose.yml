version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: linnet-score-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linnet_admin
      POSTGRES_PASSWORD: linnet_local_dev_password
      POSTGRES_DB: linnet_score
    ports:
      - "5532:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../packages/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linnet_admin -d linnet_score"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linnet-score-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6479:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:

